      <text x="62" y="112" fill="#67e8f9">01 / SHIPCHECK</text><text x="447" y="112" fill="#c4b5fd">02 / REGRESSION WHISPERER</text><text x="832" y="112" fill="#5eead4">03 / PHILBOX</text>
      <text x="254" y="274" fill="#fde68a">04 / PACMAZE ADVENTURES</text><text x="640" y="274" fill="#c4b5fd">05 / SPECSIM</text>
