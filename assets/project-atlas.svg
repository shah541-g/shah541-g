<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Selected engineering project atlas</title>
  <desc id="desc">Five project panels show distinct engineering themes: containment, knowledge retrieval, healthcare workflows, client-server software, and agent evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="route" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#facc15"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="14" fill="url(#bg)"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="38" y="34" fill="#64748b" font-size="11" letter-spacing="2">SELECTED WORK / SYSTEMS WITH A POINT OF VIEW</text>
    <path d="M40 56h1120" stroke="#334155"/>
    <g fill="#182235" stroke="#475569">
      <rect x="40" y="82" width="350" height="120" rx="11"/><rect x="425" y="82" width="350" height="120" rx="11"/><rect x="810" y="82" width="350" height="120" rx="11"/>
      <rect x="232" y="244" width="350" height="120" rx="11"/><rect x="618" y="244" width="350" height="120" rx="11"/>
