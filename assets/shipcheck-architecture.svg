<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">ShipCheck architecture</title>
  <desc id="desc">A policy gate controls an AI planner and isolated browser sandbox before evidence reaches a report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" x2="1">
      <stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="230" rx="14" fill="url(#bg)"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
    <g fill="#182235" stroke="#475569">
      <rect x="34" y="78" width="150" height="74" rx="10"/><rect x="224" y="78" width="170" height="74" rx="10"/>
      <rect x="434" y="78" width="180" height="74" rx="10"/><rect x="654" y="50" width="220" height="130" rx="10"/>
      <rect x="914" y="78" width="230" height="74" rx="10"/>
    </g>
    <g fill="#67e8f9" font-size="12">
      <text x="54" y="104">PUBLIC TARGET</text><text x="244" y="104">URL POLICY</text>
      <text x="454" y="104">AI PLANNER</text><text x="674" y="76">DISPOSABLE SANDBOX</text>
      <text x="934" y="104">EVIDENCE REPORT</text>
    </g>
    <g fill="#94a3b8">
      <text x="54" y="128" fill="#f8fafc">website</text><text x="244" y="128" fill="#f8fafc">scope + scheme</text>
      <text x="454" y="128" fill="#f8fafc">one action</text><text x="674" y="102" fill="#f8fafc">gVisor · Playwright</text>
      <text x="674" y="126" fill="#f8fafc">network + secret limits</text><text x="934" y="128" fill="#f8fafc">findings + screenshots</text>
    </g>
    <g fill="none" stroke="url(#stroke)" stroke-width="2">
      <path d="M184 115h40M394 115h40M614 115h40M874 115h40"/>
    </g>
    <g fill="#67e8f9">
      <circle cx="204" cy="115" r="3"/><circle cx="414" cy="115" r="3"/><circle cx="634" cy="115" r="3"/><circle cx="894" cy="115" r="3"/>
    </g>
    <text x="34" y="34" fill="#64748b">observe → constrain → act → measure</text>
  </g>
</svg>
