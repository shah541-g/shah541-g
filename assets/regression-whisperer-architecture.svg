<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Regression Whisperer architecture</title>
  <desc id="desc">A React client uses a JWT-protected Express API to search a MongoDB knowledge base and request Gemini assistance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="stroke" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>
  <rect width="1200" height="230" rx="14" fill="url(#bg)"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
    <g fill="#182235" stroke="#475569">
      <rect x="48" y="78" width="190" height="74" rx="10"/><rect x="304" y="78" width="205" height="74" rx="10"/>
      <rect x="575" y="78" width="210" height="74" rx="10"/><rect x="851" y="50" width="300" height="130" rx="10"/>
    </g>
    <g fill="#a78bfa" font-size="12"><text x="68" y="104">REACT WORKSPACE</text><text x="324" y="104">JWT API BOUNDARY</text><text x="595" y="104">KNOWLEDGE STORE</text><text x="871" y="76">ASSISTED DEBUGGING</text></g>
    <g fill="#f8fafc"><text x="68" y="128">search · import · voice</text><text x="324" y="128">org-aware routes</text><text x="595" y="128">MongoDB · lessons</text><text x="871" y="102">Gemini</text><text x="871" y="126">analytics · occurrences</text></g>
    <g fill="none" stroke="url(#stroke)" stroke-width="2"><path d="M238 115h66M509 115h66M785 115h66"/></g>
    <g fill="#a78bfa"><circle cx="271" cy="115" r="3"/><circle cx="542" cy="115" r="3"/><circle cx="818" cy="115" r="3"/></g>
    <text x="48" y="34" fill="#64748b">capture → classify → retrieve → explain</text>
  </g>
</svg>
