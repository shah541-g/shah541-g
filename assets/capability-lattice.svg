<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Engineering disciplines</title>
  <desc id="desc">Six connected disciplines represent application development, backend systems, architecture, infrastructure, AI engineering, and foundations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="route" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#facc15"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <g fill="none" stroke="#334155" stroke-width="1">
    <path d="M80 70h1040M80 150h1040M80 230h1040"/>
    <path d="M100 42v216M300 42v216M500 42v216M700 42v216M900 42v216M1100 42v216"/>
  </g>
  <path d="M100 150C220 50 280 250 400 150S580 50 700 150s180 100 300 0" fill="none" stroke="url(#route)" stroke-width="2.5"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <g fill="#64748b" font-size="11" letter-spacing="2"><text x="54" y="34">THE ENGINEERING SURFACE</text><text x="1000" y="34">01—06</text></g>
    <g fill="#182235" stroke="#475569">
      <rect x="42" y="116" width="150" height="68" rx="10"/><rect x="242" y="116" width="150" height="68" rx="10"/>
      <rect x="442" y="116" width="150" height="68" rx="10"/><rect x="642" y="116" width="150" height="68" rx="10"/>
      <rect x="842" y="116" width="150" height="68" rx="10"/><rect x="1042" y="116" width="116" height="68" rx="10"/>
    </g>
    <g font-size="12" font-weight="600">
      <text x="60" y="143" fill="#67e8f9">01 / APPLICATIONS</text><text x="260" y="143" fill="#67e8f9">02 / BACKEND</text>
      <text x="460" y="143" fill="#c4b5fd">03 / ARCHITECTURE</text><text x="660" y="143" fill="#c4b5fd">04 / INFRASTRUCTURE</text>
      <text x="860" y="143" fill="#fde68a">05 / AI SYSTEMS</text><text x="1060" y="143" fill="#fde68a">06 / FOUNDATIONS</text>
    </g>
    <g fill="#f8fafc" font-size="12">
      <text x="60" y="165">web · mobile · desktop</text><text x="260" y="165">APIs · workflows · auth</text>
      <text x="460" y="165">models · boundaries</text><text x="660" y="165">Docker · CI/CD · cloud</text>
      <text x="860" y="165">agents · transformers</text><text x="1060" y="165">OOP · DSA · data</text>
    </g>
    <g fill="#67e8f9"><circle cx="100" cy="150" r="4"/><circle cx="300" cy="150" r="4"/></g>
    <g fill="#a78bfa"><circle cx="500" cy="150" r="4"/><circle cx="700" cy="150" r="4"/></g>
    <g fill="#facc15"><circle cx="900" cy="150" r="4"/><circle cx="1100" cy="150" r="4"/></g>
  </g>
</svg>
